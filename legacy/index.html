<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AdMath | Ad Campaign Calculator</title>
<meta name="description" content="Compare ad campaign scenarios: CTR, CPC, CPM, CPA, ROAS and ROI in one place.">
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#14161f;--mute:#5d6475;--line:#e2e5ee;--accent:#4f46e5;--good:#15803d;--bad:#b91c1c}
@media (prefers-color-scheme:dark){:root{--bg:#0f1117;--card:#181b25;--ink:#eceef5;--mute:#9aa1b4;--line:#2a2f3d;--accent:#8b85ff;--good:#4ade80;--bad:#f87171}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:24px 16px 48px}h1{margin:0;font-size:1.8rem}.sub{color:var(--mute);margin:4px 0 20px}
.bar-top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
button{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.ghost{background:transparent;color:var(--accent)}button:disabled{opacity:.5;cursor:not-allowed}
.cur{display:flex;gap:6px;align-items:center;margin-left:auto;color:var(--mute)}.cur input{width:70px}
input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px}
.cards{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.row{display:flex;gap:8px;margin-bottom:12px}.name{flex:1;font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.f{display:flex;flex-direction:column;font-size:.8rem;color:var(--mute)}.f input{width:100%}
.warn{color:var(--bad);font-size:.85rem;margin:8px 0 0}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 0}.metrics div{background:var(--bg);border-radius:8px;padding:8px}
dt{font-size:.72rem;color:var(--mute)}dd{margin:0;font-weight:700}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:16px}h2{margin:0 0 8px;font-size:1.1rem}
.chart{width:100%;height:auto}.lbl,.val{fill:var(--ink);font-size:13px}.bar{fill:var(--accent)}.best{color:var(--good);font-weight:600}
footer{color:var(--mute);font-size:.85rem;margin-top:24px}
</style>
</head>
<body>
<div class="wrap"><div id="root"></div><noscript>Please enable JavaScript to use AdMath.</noscript></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script>
const h = React.createElement, { useState, useEffect } = React, KEY = "admath.v1";
const FIELDS = [["spend","Ad spend"],["impressions","Impressions"],["clicks","Clicks"],["conversions","Conversions"],["revenue","Revenue"]];
const EXAMPLE = [
  { name: "Example A (sample)", spend: "20000", impressions: "400000", clicks: "8000", conversions: "240", revenue: "96000" },
  { name: "Example B (sample)", spend: "20000", impressions: "250000", clicks: "6500", conversions: "130", revenue: "52000" }
];
const blank = n => ({ id: Date.now() + Math.random(), name: "Scenario " + n, spend: "", impressions: "", clicks: "", conversions: "", revenue: "" });
const num = v => { const x = parseFloat(v); return isFinite(x) && x >= 0 ? x : 0; };
const div = (a, b) => b > 0 ? a / b : null;
const mul = (v, k) => v === null ? null : v * k;
const fmt = v => v.toLocaleString(undefined, { maximumFractionDigits: 2 });
const P = v => v === null ? "–" : fmt(v) + "%";
const M = (v, c) => v === null ? "–" : c + " " + fmt(v);
const X = v => v === null ? "–" : fmt(v) + "x";
const METRICS = [["ctr","CTR",P],["cpc","CPC",M],["cpm","CPM",M],["cvr","Conv. rate",P],["cpa","CPA",M],["roas","ROAS",X],["roi","ROI",P]];

function calc(s) {
  const sp = num(s.spend), im = num(s.impressions), cl = num(s.clicks), cv = num(s.conversions), rv = num(s.revenue);
  return { ctr: mul(div(cl, im), 100), cpc: div(sp, cl), cpm: mul(div(sp, im), 1000), cvr: mul(div(cv, cl), 100),
    cpa: div(sp, cv), roas: div(rv, sp), roi: sp > 0 ? (rv - sp) / sp * 100 : null };
}
function warn(s) {
  const w = [];
  if (num(s.clicks) > num(s.impressions) && num(s.impressions) > 0) w.push("Clicks are higher than impressions. Check the numbers.");
  if (num(s.conversions) > num(s.clicks) && num(s.clicks) > 0) w.push("Conversions are higher than clicks. Check the numbers.");
  return w;
}
function load() {
  try { const r = JSON.parse(localStorage.getItem(KEY)); if (r && Array.isArray(r.items) && r.items.length) return r; } catch (e) {}
  return { cur: "PKR", items: [blank(1)] };
}
function csv(items) {
  const head = ["Scenario","Spend","Impressions","Clicks","Conversions","Revenue","CTR %","CPC","CPM","Conv rate %","CPA","ROAS","ROI %"];
  const q = v => v === null || v === undefined ? "" : '"' + String(typeof v === "number" ? +v.toFixed(2) : v).replace(/"/g, '""') + '"';
  const rows = items.map(s => { const m = calc(s); return [s.name,s.spend,s.impressions,s.clicks,s.conversions,s.revenue,m.ctr,m.cpc,m.cpm,m.cvr,m.cpa,m.roas,m.roi].map(q).join(","); });
  return [head.join(",")].concat(rows).join("\n");
}
function download(items) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv(items)], { type: "text/csv" }));
  a.download = "admath-scenarios.csv"; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function Field(p) {
  return h("label", { className: "f" }, h("span", null, p.label),
    h("input", { type: "number", min: "0", step: "any", inputMode: "decimal", value: p.value, onChange: e => p.onChange(e.target.value) }));
}
function Card(p) {
  const s = p.s, m = calc(s);
  return h("section", { className: "card" },
    h("div", { className: "row" },
      h("input", { className: "name", value: s.name, "aria-label": "Scenario name", onChange: e => p.set("name", e.target.value) }),
      p.canRemove && h("button", { className: "ghost", onClick: p.remove, "aria-label": "Remove " + s.name }, "Remove")),
    h("div", { className: "grid" }, FIELDS.map(([k, l]) => h(Field, { key: k, label: l, value: s[k], onChange: v => p.set(k, v) }))),
    warn(s).map((t, i) => h("p", { key: i, className: "warn" }, t)),
    h("dl", { className: "metrics" }, METRICS.map(([k, l, f]) => h("div", { key: k }, h("dt", null, l), h("dd", null, f(m[k], p.cur))))));
}
function Chart(p) {
  const rows = p.items.map(s => ({ n: s.name || "Untitled", v: calc(s).roas }));
  const max = Math.max(1, ...rows.map(r => r.v || 0));
  return h("svg", { viewBox: "0 0 600 " + (rows.length * 40 + 10), className: "chart", role: "img", "aria-label": "ROAS by scenario" },
    rows.map((r, i) => { const w = Math.max(2, (r.v || 0) / max * 400);
      return h("g", { key: i },
        h("text", { x: 0, y: i * 40 + 24, className: "lbl" }, r.n.slice(0, 16)),
        h("rect", { x: 130, y: i * 40 + 8, rx: 4, height: 22, width: w, className: "bar" }),
        h("text", { x: 138 + w, y: i * 40 + 24, className: "val" }, X(r.v))); }));
}
function App() {
  const [st, setSt] = useState(load);
  useEffect(() => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }, [st]);
  const items = st.items, cur = st.cur;
  const setItems = fn => setSt(s => ({ ...s, items: fn(s.items) }));
  const best = items.reduce((b, s) => { const r = calc(s).roas; return r !== null && (b === null || r > b.r) ? { n: s.name, r } : b; }, null);
  return h("main", null,
    h("h1", null, "AdMath"),
    h("p", { className: "sub" }, "Compare ad campaign scenarios. Enter your numbers and see CTR, CPC, CPM, CPA, ROAS and ROI."),
    h("div", { className: "bar-top" },
      h("button", { disabled: items.length >= 4, onClick: () => setItems(a => a.concat(blank(a.length + 1))) }, "Add scenario"),
      h("button", { className: "ghost", onClick: () => setSt(s => ({ ...s, items: EXAMPLE.map((e, i) => ({ ...blank(i + 1), ...e })) })) }, "Load sample numbers"),
      h("button", { className: "ghost", onClick: () => download(items) }, "Export CSV"),
      h("button", { className: "ghost", onClick: () => setSt(s => ({ ...s, items: [blank(1)] })) }, "Reset"),
      h("label", { className: "cur" }, "Currency", h("input", { value: cur, maxLength: 4, onChange: e => setSt(s => ({ ...s, cur: e.target.value })) }))),
    h("div", { className: "cards" }, items.map((s, i) => h(Card, { key: s.id, s, cur, canRemove: items.length > 1,
      set: (k, v) => setItems(a => a.map((x, j) => j === i ? { ...x, [k]: v } : x)), remove: () => setItems(a => a.filter((_, j) => j !== i)) }))),
    h("section", { className: "panel" }, h("h2", null, "ROAS comparison"),
      best ? h("p", null, "Best return: ", h("span", { className: "best" }, best.n + " (" + X(best.r) + ")")) : h("p", null, "Enter spend and revenue to compare."),
      h(Chart, { items })),
    h("footer", null, "Built by Devraj Raisal. All calculations run in your browser and nothing is sent anywhere. Sample numbers are not real campaign data."));
}
ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
